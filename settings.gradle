pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'PictureBridge'

def versions = [
        '1.14', '1.14.1', '1.14.2', '1.14.3', '1.14.4',
        '1.15', '1.15.1', '1.15.2',
        '1.16', '1.16.1', '1.16.2', '1.16.3', '1.16.4', '1.16.5',
        '1.17', '1.17.1',
        '1.18', '1.18.1', '1.18.2',
        '1.19', '1.19.1', '1.19.2', '1.19.3', '1.19.4',
        '1.20.1', '1.20.6',
        '1.21.1', '1.21.4', '1.21.8', '1.21.10', '1.21.11',
        '26.1', '26.2'
]

versions.each { minecraftVersion ->
    def projectName = "fabric-${minecraftVersion}"
    include projectName
    project(":${projectName}").projectDir = file("versions/${projectName}")
}