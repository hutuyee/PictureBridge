apply plugin: 'net.fabricmc.fabric-loom-remap'
apply plugin: 'maven-publish'

def target = project.ext.fabricTarget
// Minecraft 1.18 introduced the bundled server jars required for splitting.
def splitClientSources = target.minecraft.tokenize('.')[1].toInteger() >= 18

base {
    archivesName = "picturebridge-fabric-${target.minecraft}"
}

loom {
    if (splitClientSources) {
        splitEnvironmentSourceSets()
    }

    mods {
        picturebridge {
            sourceSet sourceSets.main
            if (splitClientSources) {
                sourceSet sourceSets.client
            }
        }
    }
}

def legacyJavaSources = [
        rootProject.file('versions/fabric-legacy-src/common/java'),
        rootProject.file("versions/fabric-legacy-src/${target.source}/java"),
        rootProject.file('versions/forge-common/src/main/java')
]
if (target.source in ['1.19', '1.19.4']) {
    legacyJavaSources.add(rootProject.file('versions/fabric-legacy-src/1.19-common/java'))
}
def modSourceSet = splitClientSources ? sourceSets.client : sourceSets.main
modSourceSet.java.setSrcDirs(legacyJavaSources)
modSourceSet.resources.setSrcDirs([
        rootProject.file('versions/fabric-legacy-resources/src/client/resources')
])

dependencies {
    minecraft "com.mojang:minecraft:${target.minecraft}"
    // These early Yarn v2 artifacts have the intermediary and named columns reversed.
    def yarnClassifier = target.minecraft in ['1.14', '1.14.1', '1.14.2'] ? '' : ':v2'
    mappings "net.fabricmc:yarn:${target.yarn}${yarnClassifier}"
    modImplementation "net.fabricmc:fabric-loader:${target.loader}"
}

def metadataProperties = [
        version           : project.version,
        minecraft_version : target.minecraft,
        loader_version    : target.loader,
        java_version      : target.java,
        java_compatibility: "JAVA_${target.java}"
]

tasks.named(modSourceSet.processResourcesTaskName) {
    inputs.properties metadataProperties
    filesMatching(['fabric.mod.json', 'picturebridge.client.mixins.json']) {
        expand metadataProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = target.java as int
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { 'LICENSE_picturebridge' }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}
