plugins {
    id 'base'
    id 'net.neoforged.moddev' version '2.0.144' apply false
}

def targets = [
        'neoforge-1.20.2' : [minecraft: '1.20.2', neoforge: '20.2.93', source: '1.20.4', java: 17, metadata: 'mods-loader'],
        'neoforge-1.20.3' : [minecraft: '1.20.3', neoforge: '20.3.8-beta', source: '1.20.4', java: 17, metadata: 'mods-loader'],
        'neoforge-1.20.4' : [minecraft: '1.20.4', neoforge: '20.4.251', source: '1.20.4', java: 17, metadata: 'mods-loader'],
        'neoforge-1.20.5' : [minecraft: '1.20.5', neoforge: '20.5.21-beta', source: '1.20.6', java: 21, metadata: 'loader'],
        'neoforge-1.20.6' : [minecraft: '1.20.6', neoforge: '20.6.139', source: '1.20.6', java: 21, metadata: 'loader'],
        'neoforge-1.21'   : [minecraft: '1.21', neoforge: '21.0.167', source: '1.20.6', java: 21, metadata: 'loader'],
        'neoforge-1.21.1' : [minecraft: '1.21.1', neoforge: '21.1.248', source: '1.20.6', java: 21, metadata: 'loader'],
        'neoforge-1.21.2' : [minecraft: '1.21.2', neoforge: '21.2.1-beta', source: '1.21.4', java: 21, metadata: 'loader'],
        'neoforge-1.21.3' : [minecraft: '1.21.3', neoforge: '21.3.97', source: '1.21.4', java: 21, metadata: 'loader'],
        'neoforge-1.21.4' : [minecraft: '1.21.4', neoforge: '21.4.157', source: '1.21.4', java: 21, metadata: 'loader'],
        'neoforge-1.21.5' : [minecraft: '1.21.5', neoforge: '21.5.98', source: '1.21.8', java: 21, metadata: 'modern'],
        'neoforge-1.21.6' : [minecraft: '1.21.6', neoforge: '21.6.20-beta', source: '1.21.8', java: 21, metadata: 'modern'],
        'neoforge-1.21.7' : [minecraft: '1.21.7', neoforge: '21.7.25-beta', source: '1.21.8', java: 21, metadata: 'modern'],
        'neoforge-1.21.8' : [minecraft: '1.21.8', neoforge: '21.8.54', source: '1.21.8', java: 21, metadata: 'modern'],
        'neoforge-1.21.9' : [minecraft: '1.21.9', neoforge: '21.9.16-beta', source: '1.21.11', java: 21, metadata: 'modern'],
        'neoforge-1.21.10': [minecraft: '1.21.10', neoforge: '21.10.64', source: '1.21.11', java: 21, metadata: 'modern'],
        'neoforge-1.21.11': [minecraft: '1.21.11', neoforge: '21.11.45', source: '1.21.11', java: 21, metadata: 'modern'],
        'neoforge-26.1'   : [minecraft: '26.1', neoforge: '26.1.0.19-beta', source: '26.1', java: 25, metadata: 'modern'],
        'neoforge-26.1.1' : [minecraft: '26.1.1', neoforge: '26.1.1.15-beta', source: '26.1', java: 25, metadata: 'modern'],
        'neoforge-26.1.2' : [minecraft: '26.1.2', neoforge: '26.1.2.98', source: '26.1', java: 25, metadata: 'modern']
]

subprojects { adapter ->
    def target = targets[adapter.name]
    if (target == null) {
        throw new GradleException("Missing NeoForge target configuration for ${adapter.name}")
    }

    apply plugin: 'java-library'
    apply plugin: 'net.neoforged.moddev'

    group = 'haaa.picturebridge'
    version = rootProject.mod_version

    base {
        archivesName = "picturebridge-${adapter.name}"
    }

    java.toolchain.languageVersion = JavaLanguageVersion.of(target.java as int)

    def javaSources
    if (target.source == '26.1') {
        javaSources = [
                rootProject.file('../fabric-26.1/src/client/java'),
                rootProject.file('../neoforge-src/26.1/java'),
                rootProject.file('../neoforge-src/entry/java')
        ]
    } else {
        javaSources = [
                rootProject.file("../neoforge-src/${target.source}/java"),
                rootProject.file('../neoforge-src/entry/java'),
                rootProject.file('../forge-common/src/main/java')
        ]
        if (target.source in ['1.20.4', '1.20.6', '1.21.1', '1.21.4']) {
            javaSources.add(rootProject.file('../neoforge-src/shared-old-chat/java'))
            javaSources.add(rootProject.file('../neoforge-src/shared-screen-old-input/java'))
        } else if (target.source in ['1.21.8', '1.21.11']) {
            javaSources.add(rootProject.file('../neoforge-src/shared-screen-old-input/java'))
            javaSources.add(rootProject.file('../neoforge-src/shared-adt-chat/java'))
        }
    }
    sourceSets.main.java.setSrcDirs(javaSources)
    sourceSets.main.resources.setSrcDirs([
            rootProject.file('../neoforge-common/src/main/resources'),
            rootProject.file('../neoforge-metadata/common'),
            rootProject.file("../neoforge-metadata/${target.metadata}")
    ])

    neoForge {
        version = target.neoforge
        runs {
            client { client() }
        }
        mods {
            picturebridge { sourceSet(sourceSets.main) }
        }
    }

    def metadataProperties = [
            mod_version       : rootProject.mod_version,
            minecraft_version : target.minecraft,
            neoforge_version   : target.neoforge,
            java_compatibility : "JAVA_${target.java}",
            mixin_package      : target.source == '26.1'
                    ? 'haaa.picturebridge.fabric.mixin.client'
                    : 'haaa.picturebridge.neoforge.mixin',
            mixin_class        : target.source == '26.1'
                    ? 'ChatScreenMixin'
                    : (target.minecraft == '1.21.11'
                    ? 'ChatScreenMixin'
                    : 'ScreenMixin')
    ]

    tasks.named('processResources', ProcessResources).configure {
        inputs.properties(metadataProperties)
        filesMatching([
                'META-INF/mods.toml',
                'META-INF/neoforge.mods.toml',
                'picturebridge.neoforge.mixins.json'
        ]) {
            expand(metadataProperties)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = target.java as int
        options.encoding = 'UTF-8'
    }

    tasks.named('jar', Jar).configure {
        from(rootProject.file('../LICENSE')) {
            rename { 'LICENSE_picturebridge' }
        }
    }
}
