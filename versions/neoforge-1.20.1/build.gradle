plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

def rootProperties = new Properties()
new File(project.projectDir, '../../gradle.properties').withInputStream { rootProperties.load(it) }
def modVersion = rootProperties.mod_version
version = modVersion
group = 'haaa.picturebridge'
base.archivesName = 'picturebridge-neoforge-1.20.1'

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        client {
            workingDirectory project.file('run')
            mods {
                picturebridge { source sourceSets.main }
            }
        }
    }
}

sourceSets.main.java.setSrcDirs([
        'src/main/java',
        '../neoforge-src/1.20.4/java',
        '../neoforge-src/shared-old-chat/java',
        '../neoforge-src/shared-screen-old-input/java',
        '../forge-common/src/main/java'
])
sourceSets.main.resources.setSrcDirs([
        'src/main/resources',
        '../neoforge-common/src/main/resources',
        '../neoforge-metadata/common'
])

dependencies {
    minecraft "net.neoforged:forge:${minecraft_version}-${neoforge_version}"
}

def metadataProperties = [
        mod_version       : modVersion,
        minecraft_version : minecraft_version,
        neoforge_version   : neoforge_version,
        java_compatibility : 'JAVA_17',
        mixin_package      : 'haaa.picturebridge.neoforge.mixin',
        mixin_class        : 'ScreenMixin'
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties(metadataProperties)
    filesMatching(['META-INF/mods.toml', 'picturebridge.neoforge.mixins.json']) {
        expand(metadataProperties)
    }
}

tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
    from('../LICENSE') { rename { 'LICENSE_picturebridge' } }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}
