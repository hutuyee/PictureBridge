pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

rootProject.name = 'picturebridge-neoforge-legacy'

['1.20.2', '1.20.3', '1.20.5'].each { minecraftVersion ->
    def projectName = "neoforge-${minecraftVersion}"
    include projectName
    project(":${projectName}").projectDir = file("../${projectName}")
}
