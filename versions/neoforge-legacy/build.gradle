plugins {
    id 'base'
    id 'net.neoforged.gradle.userdev' version '7.1.39' apply false
}

// These releases predate the dependency bundles required by ModDevGradle.
def targets = [
        'neoforge-1.20.2': [minecraft: '1.20.2', neoforge: '20.2.93', source: '1.20.4', java: 17, metadata: 'mods-loader'],
        'neoforge-1.20.3': [minecraft: '1.20.3', neoforge: '20.3.8-beta', source: '1.20.4', java: 17, metadata: 'mods-loader'],
        'neoforge-1.20.5': [minecraft: '1.20.5', neoforge: '20.5.21-beta', source: '1.20.6', java: 21, metadata: 'loader']
]

def rootProperties = new Properties()
rootProject.file('../../gradle.properties').withInputStream { rootProperties.load(it) }

subprojects { adapter ->
    def target = targets[adapter.name]
    if (target == null) {
        throw new GradleException("Missing NeoForge target configuration for ${adapter.name}")
    }

    apply plugin: 'java-library'
    apply plugin: 'net.neoforged.gradle.userdev'

    group = 'haaa.picturebridge'
    version = rootProperties.mod_version
    base { archivesName = "picturebridge-${adapter.name}" }
    java.toolchain.languageVersion = JavaLanguageVersion.of(target.java as int)

    sourceSets.main.java.setSrcDirs([
            rootProject.file("../neoforge-src/${target.source}/java"),
            rootProject.file('../neoforge-src/entry/java'),
            rootProject.file('../neoforge-src/shared-old-chat/java'),
            rootProject.file('../neoforge-src/shared-screen-old-input/java'),
            rootProject.file('../forge-common/src/main/java')
    ])
    sourceSets.main.resources.setSrcDirs([
            rootProject.file('../neoforge-common/src/main/resources'),
            rootProject.file('../neoforge-metadata/common'),
            rootProject.file("../neoforge-metadata/${target.metadata}")
    ])

    dependencies { implementation "net.neoforged:neoforge:${target.neoforge}" }
    runs {
        client { modSource sourceSets.main }
    }

    def metadataProperties = [
            mod_version: project.version,
            minecraft_version: target.minecraft,
            neoforge_version: target.neoforge,
            java_compatibility: "JAVA_${target.java}",
            mixin_package: 'haaa.picturebridge.neoforge.mixin',
            mixin_class: 'ScreenMixin'
    ]
    tasks.named('processResources', ProcessResources).configure {
        inputs.properties metadataProperties
        filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'picturebridge.neoforge.mixins.json']) {
            expand metadataProperties
        }
    }
    tasks.withType(JavaCompile).configureEach {
        options.release = target.java as int
        options.encoding = 'UTF-8'
    }
    tasks.named('jar', Jar).configure {
        from(rootProject.file('../../LICENSE')) { rename { 'LICENSE_picturebridge' } }
    }
}
