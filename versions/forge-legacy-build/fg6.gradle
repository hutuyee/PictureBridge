buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.+' }
}

apply plugin: net.minecraftforge.gradle.userdev.UserDevPlugin

def target = project.ext.forgeTarget
def rootProperties = new Properties()
new File(project.projectDir, '../../gradle.properties').withInputStream { rootProperties.load(it) }
def modVersion = rootProperties.mod_version
version = modVersion
group = 'haaa.picturebridge'
base.archivesName = "picturebridge-forge-${target.minecraft}"
java.toolchain.languageVersion = JavaLanguageVersion.of(8)

def mappingChannel = 'official'
if (target.minecraft == '1.16.1') {
    // Forge 32 adds getHeight(), which collides with Mojang's name for
    // func_238483_d_. MCP calls the vanilla method getHeightRealms instead.
    // Override only that mapping so both compilation and reobfuscation see
    // distinct methods, without changing Forge's runtime classes.
    def providers = extensions.getByType(net.minecraftforge.gradle.mcp.ChannelProvidersExtension)
    def official = providers.getProvider('official')
    providers.addProvider([
            getChannels: { Collections.singleton('officialfix') },
            getMappingsFile: { repo, mappingProject, channel, mappingVersion ->
                def original = official.getMappingsFile(repo, mappingProject, 'official', mappingVersion)
                if (original == null) return null
                def output = mappingProject.file("build/mappings/officialfix-${mappingVersion}.zip")
                output.parentFile.mkdirs()
                new java.util.zip.ZipFile(original).withCloseable { input ->
                    new java.util.zip.ZipOutputStream(new FileOutputStream(output)).withCloseable { zip ->
                        input.entries().each { entry ->
                            def bytes = input.getInputStream(entry).withCloseable { it.bytes }
                            if (entry.name == 'methods.csv') {
                                def csv = new String(bytes, 'UTF-8')
                                def collision = 'func_238483_d_,getHeight,'
                                if (!csv.contains(collision)) {
                                    throw new GradleException('Missing expected Forge 1.16.1 getHeight mapping')
                                }
                                bytes = csv.replace(collision, 'func_238483_d_,getHeightRealms,').getBytes('UTF-8')
                            }
                            def copy = new java.util.zip.ZipEntry(entry.name)
                            copy.time = 0
                            zip.putNextEntry(copy)
                            zip.write(bytes)
                            zip.closeEntry()
                        }
                    }
                }
                return output
            }
    ] as net.minecraftforge.gradle.mcp.ChannelProvider)
    mappingChannel = 'officialfix'
}

minecraft {
    mappings channel: mappingChannel, version: target.minecraft
    runs {
        client {
            workingDirectory project.file('run')
            mods { picturebridge { source sourceSets.main } }
        }
    }
}

sourceSets.main.java.setSrcDirs([
        project.file('../forge-1.16.5/src/main/java'),
        project.file('../forge-common/src/main/java')
])
sourceSets.main.resources.setSrcDirs([
        project.file('../forge-legacy-build/fg6-resources'),
        project.file('../neoforge-common/src/main/resources')
])

dependencies { minecraft "net.minecraftforge:forge:${target.minecraft}-${target.forge}" }

def props=[version:project.version,minecraft_version:target.minecraft,forge_version:target.forge,forge_major:target.forge.tokenize('.')[0]]
tasks.named('processResources',ProcessResources).configure {
    inputs.properties props
    filesMatching(['META-INF/mods.toml','pack.mcmeta']) { expand props }
}
tasks.named('jar',Jar).configure { finalizedBy 'reobfJar' }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
